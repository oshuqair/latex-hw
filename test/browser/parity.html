<!doctype html><meta charset="utf-8"><body><pre id="out">pending</pre>
<script type="module">
const lib = await import('../../dist/latex-hw.browser.js');
const r = await lib.createBrowserRenderer(new URL('../../dist/fonts/', import.meta.url).href);
const tex = new URLSearchParams(location.search).get('tex');
const dir = new URLSearchParams(location.search).get('dir') || 'ltr';
const svg = r.render(tex, { dir }).svg;
document.getElementById('out').textContent = btoa(unescape(encodeURIComponent(svg)));
</script>
